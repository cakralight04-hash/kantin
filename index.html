<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kantin Sekolah</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #fafafa;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .item {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    #keranjang {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    #total {
      font-weight: bold;
      margin-top: 15px;
      text-align: right;
    }
    .hapus-btn {
      background: #e74c3c;
      padding: 5px 10px;
      border-radius: 5px;
    }
    .hapus-btn:hover {
      background: #c0392b;
    }
  </style>
</head>
<body>

<h1>🍽️ Kantin Sekolah</h1>

<div class="menu" id="menu"></div>

<div id="keranjang">
  <h2>🛒 Keranjang</h2>
  <table id="tabelKeranjang">
    <tr><th>Menu</th><th>Harga</th><th>Aksi</th></tr>
  </table>
  <p id="total">Total: Rp 0</p>
  <button onclick="pesan()">Pesan Sekarang</button>
</div>

<script>
  const menu = [
    { nama: "Nasi Goreng", harga: 12000 },
    { nama: "Mie Goreng", harga: 10000 },
    { nama: "Nasi Uduk", harga: 8000 },
    { nama: "Soto Ayam", harga: 15000 },
    { nama: "Teh Manis", harga: 5000 },
    { nama: "Es Jeruk", harga: 6000 },
    { nama: "Susu Coklat", harga: 7000 }
  ];

  let keranjang = [];

  function tampilkanMenu() {
    const menuDiv = document.getElementById("menu");
    menu.forEach((item, index) => {
      const div = document.createElement("div");
      div.classList.add("item");
      div.innerHTML = `
        <h3>${item.nama}</h3>
        <p>Rp ${item.harga.toLocaleString()}</p>
        <button onclick="tambahKeKeranjang(${index})">Tambah</button>
      `;
      menuDiv.appendChild(div);
    });
  }

  function tambahKeKeranjang(i) {
    keranjang.push(menu[i]);
    perbaruiKeranjang();
  }

  function hapusDariKeranjang(i) {
    keranjang.splice(i, 1);
    perbaruiKeranjang();
  }

  function perbaruiKeranjang() {
    const tabel = document.getElementById("tabelKeranjang");
    tabel.innerHTML = "<tr><th>Menu</th><th>Harga</th><th>Aksi</th></tr>";
    let total = 0;
    keranjang.forEach((item, i) => {
      total += item.harga;
      const row = `
        <tr>
          <td>${item.nama}</td>
          <td>Rp ${item.harga.toLocaleString()}</td>
          <td><button class='hapus-btn' onclick='hapusDariKeranjang(${i})'>Hapus</button></td>
        </tr>
      `;
      tabel.innerHTML += row;
    });
    document.getElementById("total").textContent = "Total: Rp " + total.toLocaleString();
  }

  function pesan() {
    if (keranjang.length === 0) {
      alert("Keranjang masih kosong!");
      return;
    }
    let nama = prompt("Masukkan nama Anda:");
    if (!nama) return;
    alert(`Terima kasih, ${nama}! Pesanan Anda sudah diterima.`);
    keranjang = [];
    perbaruiKeranjang();
  }

  tampilkanMenu();
</script>

</body>
</html>
