<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kantin Sekolah</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 30px;
      background: #fafafa;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    h2 {
      margin-top: 30px;
      color: #444;
    }
    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .item {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }
    button {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    #keranjang {
      margin-top: 30px;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }
    #total {
      font-weight: bold;
      margin-top: 15px;
      text-align: right;
    }
    .hapus-btn {
      background: #e74c3c;
      padding: 5px 10px;
      border-radius: 5px;
    }
    .hapus-btn:hover {
      background: #c0392b;
    }

    /* Popup (Modal) */
    .modal {
      display: none;
      position: fixed;
      z-index: 10;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      text-align: center;
      width: 90%;
      max-width: 400px;
      animation: fadeIn 0.3s;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    input[type="text"] {
      width: 80%;
      padding: 8px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    .modal-buttons {
      margin-top: 15px;
    }
    .modal-buttons button {
      margin: 0 8px;
    }
  </style>
</head>
<body>

<h1>🍽️ Kantin Sekolah</h1>

<h2>🍛 Makanan</h2>
<div class="menu" id="menuMakanan"></div>

<h2>🍹 Minuman</h2>
<div class="menu" id="menuMinuman"></div>

<div id="keranjang">
  <h2>🛒 Keranjang</h2>
  <table id="tabelKeranjang">
    <tr><th>Menu</th><th>Harga</th><th>Aksi</th></tr>
  </table>
  <p id="total">Total: Rp 0</p>
  <button onclick="bukaPopup()">Pesan Sekarang</button>
</div>

<!-- Popup Konfirmasi -->
<div id="popup" class="modal">
  <div class="modal-content">
    <h3>Konfirmasi Pesanan</h3>
    <p>Masukkan nama Anda untuk melanjutkan:</p>
    <input type="text" id="namaInput" placeholder="Nama Anda">
    <div class="modal-buttons">
      <button onclick="konfirmasiPesan()">Kirim</button>
      <button onclick="tutupPopup()">Batal</button>
    </div>
  </div>
</div>

<script>
  const makanan = [
    { nama: "Nasi Goreng Spesial", harga: 10000 },
    { nama: "Mie Goreng", harga: 8000 },
    { nama: "Nasi Uduk", harga: 9000 },
    { nama: "Sosis Bakar", harga: 5000 },
    { nama: "Roti Bakar", harga: 6000 },
    { nama: "Bakso", harga: 10000 }
  ];

  const minuman = [
    { nama: "Teh Manis Dingin / Panas", harga: 4000 },
    { nama: "Es Jeruk Segar", harga: 5000 },
    { nama: "Susu Coklat", harga: 6000 },
    { nama: "Air Mineral", harga: 3000 },
    { nama: "Jus Alpukat", harga: 8000 },
    { nama: "Kopi Hitam", harga: 5000 }
  ];

  let keranjang = [];

  function tampilkanMenu(list, idTarget) {
    const menuDiv = document.getElementById(idTarget);
    list.forEach((item, index) => {
      const div = document.createElement("div");
      div.classList.add("item");
      div.innerHTML = `
        <h3>${item.nama}</h3>
        <p>Rp ${item.harga.toLocaleString()}</p>
        <button onclick="tambahKeKeranjang('${item.nama}', ${item.harga})">Tambah</button>
      `;
      menuDiv.appendChild(div);
    });
  }

  function tambahKeKeranjang(nama, harga) {
    keranjang.push({ nama, harga });
    perbaruiKeranjang();
  }

  function hapusDariKeranjang(i) {
    keranjang.splice(i, 1);
    perbaruiKeranjang();
  }

  function perbaruiKeranjang() {
    const tabel = document.getElementById("tabelKeranjang");
    tabel.innerHTML = "<tr><th>Menu</th><th>Harga</th><th>Aksi</th></tr>";
    let total = 0;
    keranjang.forEach((item, i) => {
      total += item.harga;
      const row = `
        <tr>
          <td>${item.nama}</td>
          <td>Rp ${item.harga.toLocaleString()}</td>
          <td><button class='hapus-btn' onclick='hapusDariKeranjang(${i})'>Hapus</button></td>
        </tr>
      `;
      tabel.innerHTML += row;
    });
    document.getElementById("total").textContent = "Total: Rp " + total.toLocaleString();
  }

  // === POPUP SYSTEM ===
  function bukaPopup() {
    if (keranjang.length === 0) {
      alert("Keranjang masih kosong!");
      return;
    }
    document.getElementById("popup").style.display = "flex";
  }

  function tutupPopup() {
    document.getElementById("popup").style.display = "none";
    document.getElementById("namaInput").value = "";
  }

  function konfirmasiPesan() {
    const nama = document.getElementById("namaInput").value.trim();
    if (!nama) {
      alert("Nama tidak boleh kosong!");
      return;
    }
    alert(`Terima kasih, ${nama}! Pesanan Anda sudah diterima.`);
    keranjang = [];
    perbaruiKeranjang();
    tutupPopup();
  }

  tampilkanMenu(makanan, "menuMakanan");
  tampilkanMenu(minuman, "menuMinuman");
</script>

</body>
</html>
